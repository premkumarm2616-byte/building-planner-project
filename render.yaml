services:
  - type: web
    name: buildplan-ai
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: node server/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
